# The sources every run reads, and the per-source values its prompts need.
# method/scripts/fetch_sources.py clones them; method/scripts/prompt.py fills the prompts.
# Keep these fixed across runs so the only thing that changes is the model.
#
# Each [[source]] is one reading fork. Rails is split across two forks that
# share the letter D: they are one source.
#
# Slots (${SRC}, ${WORK}, ${LISTER}) are filled by prompt.py. In the
# compare fields, ${does}, ${shows}, ${falls} and ${confirms} become the right verb
# for a singular or plural source name.
#
# mode decides the merge's inclusion rule (step 6). "corroborate": the sources are
# independent takes on one craft, as these are, and a rule needs two or more of them.
# "compose": the sources are layers of one stack, such as a framework and the library
# under it, and a rule needs the source that owns its layer. In compose mode, every
# [[source]] also needs `layer`: what it owns, described without naming it, e.g.
# layer = "the application framework: its update loop, commands, and messages".

mode = "corroborate"

